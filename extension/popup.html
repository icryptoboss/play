<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="color-scheme" content="dark"><title>Vega</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="brand">
    <img src="icons/128.png" width="42" height="42" alt="">
    <h1>VEGA</h1>
    <span id="version" class="version"></span>
  </header>
  <main>
    <section class="status-card" aria-live="polite">
      <div class="status-label"><span class="status-dot" aria-hidden="true"></span><span id="status" role="status">Checking</span></div>
      <p id="description">Checking this tab…</p>
      <div class="site"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7.25"/><path d="M3 10h14M10 3c4 4 4 10 0 14-4-4-4-10 0-14Z"/></svg><span id="origin">web.vega-app.in</span></div>
    </section>
    <section class="access-panel" aria-labelledby="access-title">
      <h2 id="access-title">Website access</h2>
      <p id="access-description">Allow provider and video servers on all HTTP/HTTPS websites.</p>
      <button id="allow-websites" type="button" hidden>Allow all websites</button>
      <button id="remove-websites" class="secondary" type="button" hidden>Remove website access</button>
      <p id="access-feedback" role="alert" hidden></p>
    </section>
    <section class="access-panel" aria-labelledby="verification-title">
      <h2 id="verification-title">Provider verification</h2>
      <p id="incognito-description">Checking private-window access…</p>
      <button id="verification-settings" class="secondary" type="button">Verification settings</button>
    </section>
  </main>
  <footer><a href="https://web.vega-app.in" target="_blank" rel="noopener noreferrer">Open Vega <span aria-hidden="true">↗</span></a></footer>
  <script src="popup.js" type="module"></script>
</body>
</html>
